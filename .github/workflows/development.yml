name: Custom iOS Build (No JRE Downloads)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Build for iOS (with local JREs)
        run: |
          export PATH=/opt/procursus/bin:/opt/homebrew/bin:$PATH
          export JRE8_DIR=depends/java-8-openjdk
          export JRE17_DIR=depends/java-17-openjdk
          export JRE21_DIR=depends/java-21-openjdk
          export RUNNER=1 SLIMMED=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Upload regular ipa
        uses: actions/upload-artifact@v4
        with:
          name: pojavlauncher-ios.ipa
          path: artifacts/net.kdt.pojavlauncher-*-ios.ipa

      - name: Upload tipa (TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: pojavlauncher-ios-trollstore.tipa
          path: artifacts/net.kdt.pojavlauncher-*-ios-trollstore.tipa

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher.dSYM
          path: artifacts/PojavLauncher.dSYM
